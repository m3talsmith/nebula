[package]
name = "redstar"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/m3talsmith/redstar"
license = "GPL-3.0-or-later"
authors = ["m3talsmith <m3talsmith@gmail.com>"]
description = "A research focused social network"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
sea-orm = "2.0.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lib]
name = "redstar"
path = "src/lib.rs"
